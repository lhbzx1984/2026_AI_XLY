[project]
name = "tcm-tongue-diagnosis"
version = "0.1.0"
description = "中医AI舌诊辅助健康识别系统 - 青少年科技训练营教育项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.44.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
# 深度学习模式（可选）：安装后可使用 MobileNetV2 模型推理
# 规则推理模式无需安装，开箱即用
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[tool.uv]
dev-dependencies = []

# 使用清华源加速下载
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
